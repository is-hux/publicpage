name: Blocker claim
description: Claim that something is blocked. Filed claims are cold-reviewed with a charter to REFUTE; default is refuted when uncertain.
labels: ["blocker-claimed"]
body:
  - type: markdown
    attributes:
      value: |
        **Filing this does NOT set the gated item to Blocked.** A cold reviewer — never you, never the orchestrator seat — decides.
        The issue, not your lane, carries the baton: file and continue other work, or end cleanly.
        Placeholder text and missing fields bounce mechanically.
  - type: input
    id: gates
    attributes:
      label: Gates (exactly one)
      description: The issue URL of the ONE item this blocks. Zero or multiple gates auto-bounce.
      placeholder: "https://github.com/is-hux/<repo>/issues/<n>"
    validations:
      required: true
  - type: input
    id: dod-clause
    attributes:
      label: DoD clause ID
      description: The specific clause of that item's DoD this blocks. Not the whole DoD.
      placeholder: "DoD-3"
    validations:
      required: true
  - type: textarea
    id: probe-1
    attributes:
      label: Probe 1
      description: A link to run output, or a pasted probe WITH the command that produced it.
    validations:
      required: true
  - type: textarea
    id: probe-2
    attributes:
      label: Probe 2 — of a DIFFERENT KIND
      description: A second probe of a different kind from probe 1. Two readings from the same instrument are one probe.
    validations:
      required: true
  - type: input
    id: ask
    attributes:
      label: The ask
      description: One sentence, verb first. What must someone do to unblock this?
    validations:
      required: true
  - type: textarea
    id: cheapest-alternative
    attributes:
      label: Cheapest alternative, and why it fails
      description: The cheapest way to proceed WITHOUT unblocking — and the evidence it does not work. "There is no alternative" bounces.
    validations:
      required: true
  - type: input
    id: re-claim
    attributes:
      label: Re-claim (only if a prior claim on this item was refuted)
      description: Address the refutation directly. A re-claim that does not is bounced and counted.
    validations:
      required: false
